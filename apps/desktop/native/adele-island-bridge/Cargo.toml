[package]
name = "adele-island-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
windows = { version = "0.62.2", features = [
  "Foundation",
  "Media_Control",
  "Win32_System_Com",
] }
