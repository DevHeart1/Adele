name: Desktop Codex integration tests

on:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-codex-tests.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-codex-tests.yml'

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pytest-asyncio
      - run: python -m pytest apps/desktop/tests/test_codex_app_server.py -q
        env:
          PYTHONPATH: apps/desktop/backend
